server:
  port: ${PORT:8080}
  forward-headers-strategy: none
  max-http-request-header-size: 16KB
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
  tomcat:
    threads:
      max: 32
      min-spare: 2
    connection-timeout: 20s
    max-http-form-post-size: 11MB
    max-swallow-size: 11MB
    max-parameter-count: 10
    max-part-count: 5

spring:
  application:
    name: hive-template-importer
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 10000
      validation-timeout: 3000
      data-source-properties:
        connectionTimeZone: UTC
        forceConnectionTimeZoneToSession: true
        characterEncoding: UTF-8
        rewriteBatchedStatements: true
  flyway:
    enabled: true
    validate-on-migrate: true
    clean-disabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
      file-size-threshold: 11MB
  jackson:
    deserialization:
      fail-on-unknown-properties: true
    serialization:
      write-dates-as-timestamps: false

management:
  endpoints:
    access:
      default: none

app:
  allowed-origins: ${APP_ALLOWED_ORIGINS:http://localhost:5173}
  max-workspaces: ${APP_MAX_WORKSPACES:500}
  max-templates-per-workspace: ${APP_MAX_TEMPLATES_PER_WORKSPACE:10}
  max-comments-per-workspace: ${APP_MAX_COMMENTS_PER_WORKSPACE:25000}
  workspace-requests-per-hour: ${APP_WORKSPACE_REQUESTS_PER_HOUR:10}
  import-requests-per-hour: ${APP_IMPORT_REQUESTS_PER_HOUR:20}
