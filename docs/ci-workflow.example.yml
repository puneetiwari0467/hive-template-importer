# Optional example, not an active workflow. Copy into .github/workflows to enable.
name: Verify importer

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-only-ephemeral-password
          MYSQL_DATABASE: hive_importer_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --password=ci-only-ephemeral-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      TEST_DB_URL: jdbc:mysql://127.0.0.1:3306/hive_importer_test?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      TEST_DB_USERNAME: root
      TEST_DB_PASSWORD: ci-only-ephemeral-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Frontend tests
        run: npm test -- --run
        working-directory: frontend
      - name: Type check and build React
        run: npm run build
        working-directory: frontend
      - name: Backend parser and real-MySQL integration tests
        run: ./mvnw --batch-mode package
        working-directory: backend
      - name: Verify deployable JAR includes UI and sample
        shell: bash
        run: |
          jar tf backend/target/app.jar > /tmp/hive-jar-contents.txt
          grep -F 'BOOT-INF/classes/static/index.html' /tmp/hive-jar-contents.txt
          grep -F 'BOOT-INF/classes/sample-data/Room-by-Room Residential Template-2026-09-18.xls' /tmp/hive-jar-contents.txt
